<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Imposter" />
    <meta name="theme-color" content="#15111f" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Imposter Game</title>
    <style>
      html, body { background: #15111f; }
      html:not(.dark), html:not(.dark) body { background: #f5f1fc; }
    </style>
    <script>
      // Apply the saved theme before first paint so there is no white (or wrong-theme) flash.
      try {
        var savedTheme = localStorage.getItem("imposter-game-theme");
        var isDark =
          savedTheme === "light"
            ? false
            : savedTheme === "system"
              ? matchMedia("(prefers-color-scheme: dark)").matches
              : true;
        if (isDark) document.documentElement.classList.add("dark");
      } catch {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
